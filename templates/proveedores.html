{% extends "base.html" %}
{% block titulo %}Proveedores{% endblock %}

{% block contenido %}
<div class="page-header">
    <h2>Proveedores</h2>
</div>

<table class="tabla">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Contacto</th>
            <th>Teléfono</th>
            <th>Email</th>
        </tr>
    </thead>
    <tbody>
        {% for p in proveedores %}
        <tr>
            <td>{{ p.nombre }}</td>
            <td>{{ p.contacto or '-' }}</td>
            <td>{{ p.telefono or '-' }}</td>
            <td>{{ p.email or '-' }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
