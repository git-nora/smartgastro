<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartGastro - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body class="login-page">
    <div class="login-container">
        <h1>🚚 SmartGastro</h1>
        <p>Sistema de gestión para foodtrucks</p>

        {% if error %}
            <div class="alerta alerta-error">{{ error }}</div>
        {% endif %}

        {% if modo == 'registro' %}
            <form method="POST" action="/registro">
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" name="username" placeholder="Elegí un usuario" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Tu email" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <div class="input-password">
                        <input type="password" name="password" id="password-registro" placeholder="Elegí una contraseña" required>
                        <span class="ojito" onclick="togglePassword('password-registro')">👁️</span>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Registrarse</button>
            </form>
            <p class="link-cambio">¿Ya tenés cuenta? <a href="/login">Iniciá sesión</a></p>

        {% else %}
            <form method="POST" action="/login">
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" name="username" placeholder="Tu usuario" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <div class="input-password">
                        <input type="password" name="password" id="password-login" placeholder="Tu contraseña" required>
                        <span class="ojito" onclick="togglePassword('password-login')">👁️</span>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Ingresar</button>
            </form>
            <p class="link-cambio">¿No tenés cuenta? <a href="/registro">Registrate</a></p>
        {% endif %}
    </div>

    <script>
        function togglePassword(id) {
            const input = document.getElementById(id);
            input.type = input.type === "password" ? "text" : "password";
        }
    </script>
</body>
</html>
